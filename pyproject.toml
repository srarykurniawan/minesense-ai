[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minesense"
version = "1.0.0"
description = "MineSense AI — platform AI Engineering end-to-end untuk industri pertambangan (RAG, fine-tuning, ekstraksi, klasifikasi insiden)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.46", "pandas>=2.0"]
pdf = ["pypdf>=4.0"]
qdrant = ["qdrant-client>=1.9"]
# Embedding neural + reranker via ONNX (CPU, tanpa torch) — direkomendasikan
fastembed = ["fastembed>=0.4"]
# Embedding neural + reranker via PyTorch (butuh akses HuggingFace)
neural = ["sentence-transformers>=3.0", "torch>=2.2"]
# Fine-tuning (jalankan di GPU: Colab/Kaggle T4)
train = [
  "torch>=2.2", "transformers>=4.44", "datasets>=2.20", "peft>=0.12",
  "trl>=0.12", "accelerate>=0.33", "bitsandbytes>=0.43", "evaluate>=0.4",
]
dev = ["pytest>=8.0", "ruff>=0.4", "pandas>=2.0"]

[project.scripts]
minesense = "minesense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905"]
