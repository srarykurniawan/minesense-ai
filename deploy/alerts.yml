groups:
  - name: minesense
    rules:
      - alert: MineSenseHighErrorRate
        expr: sum(rate(minesense_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(minesense_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Error rate API > 5% selama 5 menit" }
      - alert: MineSenseSlowChat
        expr: histogram_quantile(0.95, sum(rate(minesense_request_latency_seconds_bucket{path="/v1/chat"}[5m])) by (le)) > 10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 latency /v1/chat > 10 detik" }
      - alert: MineSenseLowGrounding
        expr: sum(rate(minesense_chat_intent_total{grounded="False"}[1h])) / clamp_min(sum(rate(minesense_chat_intent_total[1h])), 1e-9) > 0.2
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "> 20% jawaban tidak grounded — cek kualitas retrieval/LLM" }
      - alert: MineSenseNegativeFeedback
        expr: increase(minesense_feedback_total{rating="-1"}[1d]) > 20
        labels: { severity: info }
        annotations: { summary: "Feedback negatif tinggi hari ini — tinjau percakapan" }
